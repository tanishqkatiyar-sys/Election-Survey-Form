<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Successful</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .success-card {
            width: 90%;
            max-width: 450px;
            padding: 40px 30px;
            text-align: center;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .success-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #dcfce7;
            color: #16a34a;
            font-size: 45px;
            font-weight: bold;
        }

        h1 {
            color: #222;
            font-size: 25px;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            background: #4f46e5;
        }
    </style>
</head>

<body>
    <div class="success-card">
        <div class="success-icon">✓</div>

        <h1>Form Submitted Successfully!</h1>
        <p>Thank you for participating in the Election Survey.</p>
        <p>Your response has been received.</p>

        <a href="/">Back to Home</a>
    </div>
</body>
</html>
